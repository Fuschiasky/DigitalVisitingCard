<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d; --surface: #161616; --border: rgba(255,255,255,0.07);
      --gold: #c9a84c; --gold-light: #e8c97a; --text: #e8e4de;
      --text-dim: rgba(232,228,222,0.55); --radius: 20px;
    }
    html, body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 200px 200px; pointer-events: none; z-index: 0;
    }
    .glow {
      position: fixed; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      width: min(420px, calc(100vw - 40px));
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 52px 40px 44px; text-align: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 40px 80px rgba(0,0,0,0.6);
      opacity: 0; transform: translateY(24px);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .card::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 2px;
    }
    .avatar-wrap {
      width: 110px; height: 110px; margin: 0 auto 28px; border-radius: 50%;
      padding: 3px; background: linear-gradient(135deg, var(--gold), #8a6a20, var(--gold-light));
      box-shadow: 0 0 30px rgba(201,168,76,0.25);
    }
    .avatar-inner {
      width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
      background: #1e1e1e; display: flex; align-items: center; justify-content: center;
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-initials {
      font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500;
      color: var(--gold-light); letter-spacing: 2px; line-height: 1; user-select: none;
    }
    .name {
      font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 500;
      letter-spacing: 0.3px; line-height: 1.1; margin-bottom: 10px;
    }
    .designation {
      font-size: 13px; font-weight: 400; color: var(--gold);
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px;
    }
    .divider { width: 40px; height: 1px; background: var(--border); margin: 0 auto 32px; }
    .phones { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .phone-item {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px; text-decoration: none;
      color: var(--text); font-size: 15px; font-weight: 400; letter-spacing: 0.5px;
      transition: background 0.2s, border-color 0.2s;
    }
    .phone-item:hover { background: rgba(201,168,76,0.06); border-color: rgba(201,168,76,0.3); }
    .phone-icon {
      flex-shrink: 0; width: 32px; height: 32px; background: rgba(201,168,76,0.1);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--gold);
    }
    .phone-icon svg { width: 15px; height: 15px; }
    .phone-label { color: var(--text-dim); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1px; }
    .phone-number { line-height: 1.2; }
    .state-card { position: relative; z-index: 1; text-align: center; padding: 60px 40px; color: var(--text-dim); }
    .state-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--text); margin-bottom: 8px; }
    .spinner {
      width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card-footer { margin-top: 32px; font-size: 11px; color: rgba(232,228,222,0.2); letter-spacing: 1px; }
    @media (max-width: 480px) { .card { padding: 44px 28px 36px; } .name { font-size: 28px; } }
  </style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div id="app">
  <div class="state-card" aria-live="polite">
    <div class="spinner"></div>
    <div class="state-title">Loading profile…</div>
  </div>
</div>
<script src="/profile.js"></script>
</body>
</html>
