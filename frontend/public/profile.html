<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #FDFCFB;
      --surface:   #e8e4de;
      --surface2:  #dedad4;
      --white:     #FFFFFF;
      --border:    rgba(13,13,13,0.09);
      --border-med:rgba(13,13,13,0.13);
      --gold:      #c9a84c;
      --gold-lt:   #e8c97a;
      --gold-dim:  rgba(201,168,76,0.18);
      --gold-bdr:  rgba(201,168,76,0.38);
      --red:       #C80651;
      --text:      #0d0d0d;
      --text-dim:  rgba(13,13,13,0.45);
      --text-muted:rgba(13,13,13,0.3);
      --radius:    20px;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      width: 100%;
    }
    .page-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%;
    }
    .page-content {
      display: flex; flex-direction: column; align-items: center;
      width: 100%;
    }
    .glow {
      position: fixed; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 0;
    }
    .brand-logo {
      position: relative; z-index: 1;
      margin-bottom: 28px;
      text-align: center;
    }
    .brand-logo img {
      width: 200px; height: auto; display: block;
    }
    .card {
      position: relative; z-index: 1;
      width: min(420px, calc(100vw - 40px));
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 52px 40px 44px; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.05);
      opacity: 0; transform: translateY(24px);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .card::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 56px; height: 2px;
      background: var(--gold);
      border-radius: 0 0 3px 3px;
    }
    .name {
      font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 500;
      font-style: italic; letter-spacing: 0.3px; line-height: 1.1; margin-bottom: 10px;
      color: var(--text);
      overflow-wrap: anywhere; word-break: break-word;
    }
    .designation {
      font-size: 11px; font-weight: 600; color: var(--text);
      letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 36px;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .divider { width: 40px; height: 1px; background: var(--border-med); margin: 0 auto 32px; }
    .phones { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .phone-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px; text-decoration: none;
      color: var(--text); font-size: 15px; font-weight: 400; letter-spacing: 0.5px;
      transition: background 0.2s, border-color 0.2s;
    }
    .phone-item:hover { background: rgba(201,168,76,0.06); border-color: var(--gold-bdr); }
    .address-item {
      cursor: default;
      align-items: flex-start;
    }
    .address-item:hover {
      background: var(--white); border-color: var(--border);
    }
    .address-item .phone-icon { margin-top: 1px; }
    .phone-icon {
      flex-shrink: 0; width: 32px; height: 32px; background: var(--gold-dim);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--gold);
    }
    .phone-icon svg { width: 15px; height: 15px; }
    /* The label+value pair sits in a bare <span> next to the icon inside
       the flex row. Without min-width:0, a flex child's implicit
       min-width:auto refuses to shrink below its content's natural
       width — so a long email/phone string pushes the row wider than
       the card instead of wrapping. text-align:left keeps wrapped lines
       from re-centering oddly inside the row. */
    .phone-item > span:last-child {
      min-width: 0; flex: 1 1 auto; text-align: left; overflow: hidden;
    }
    .phone-label { color: var(--text-dim); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1px; }
    .phone-number {
      line-height: 1.3; color: var(--text);
      overflow-wrap: anywhere; word-break: break-word;
    }
    .address-text {
      white-space: pre-line;
    }
    .card-footer {
      margin-top: 32px; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .card-footer-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--red); opacity: 0.45; }
    .card-footer-text { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
    .save-contact-btn {
      margin-top: 18px; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: rgba(201,168,76,0.06);
      border: 1.5px solid var(--gold);
      border-radius: 12px; padding: 12px 16px;
      color: var(--gold);
      font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .save-contact-btn:hover { background: rgba(201,168,76,0.12); }
    .save-contact-btn:active { transform: scale(0.98); }
    .save-contact-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .state-card { position: relative; z-index: 1; text-align: center; padding: 60px 40px; color: var(--text-dim); }
    .state-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic; color: var(--text); margin-bottom: 8px; }
    .spinner {
      width: 32px; height: 32px; border: 2px solid var(--border-med); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; }
      .name { font-size: 24px; margin-bottom: 6px; }
      .designation { margin-bottom: 18px; }
      .divider { margin: 0 auto 18px; }
      .phones { gap: 8px; }
      .phone-item { padding: 10px 12px; gap: 10px; }
      .phone-number { font-size: 14px; }
      .card-footer { margin-top: 16px; }
      .brand-logo { margin-bottom: 14px; }
      .brand-logo img { width: 140px; }
      .brand-carousels { margin-top: 14px; }
      .carousel-track-wrap { margin-bottom: 8px; }
    }
    @media (max-width: 360px) {
      .card { padding: 22px 14px 18px; }
      .name { font-size: 21px; }
      .designation { margin-bottom: 14px; }
      .divider { margin: 0 auto 14px; }
      .phones { gap: 6px; }
      .phone-item { padding: 8px 10px; }
      .card-footer { margin-top: 12px; }
      .brand-logo { margin-bottom: 10px; }
      .brand-logo img { width: 115px; }
      .brand-carousels { margin-top: 10px; }
      .carousel-track-wrap { margin-bottom: 6px; }
    }

    .brand-carousels {
      position: relative; z-index: 1;
      margin-top: 28px;
      width: 100%;
    }
    .carousel-track-wrap {
      overflow: hidden;
      margin-bottom: 14px;
      width: 100%;
    }
    .carousel-track {
      display: flex;
      align-items: center;
      gap: 28px;
      width: max-content;
    }
    .carousel-track img {
      height: 32px;
      width: auto;
      min-width: 64px;
      display: block;
      opacity: 0.85;
    }
    .carousel-track.scroll-rtl {
      animation: scroll-rtl 32s linear infinite;
    }
    .carousel-track.scroll-ltr {
      animation: scroll-ltr 32s linear infinite;
    }
    .carousel-track-wrap:hover .carousel-track,
    .carousel-track-wrap:active .carousel-track {
      animation-play-state: paused;
    }
    @keyframes scroll-rtl {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes scroll-ltr {
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .carousel-track.scroll-rtl,
      .carousel-track.scroll-ltr {
        animation: none;
      }
    }
    @media (max-width: 480px) {
      .carousel-track img { height: 20px; min-width: 40px; }
      .carousel-track { gap: 14px; }
    }
    @media (max-width: 360px) {
      .carousel-track img { height: 17px; min-width: 34px; }
      .carousel-track { gap: 10px; }
    }
    @media (min-width: 768px) {
      .carousel-track img { height: 36px; min-width: 76px; }
      .carousel-track { gap: 40px; }
    }
    @media (min-width: 900px) {
      .carousel-track img { height: 40px; min-width: 84px; }
      .carousel-track { gap: 48px; }
    }
    @media (min-width: 1300px) {
      .carousel-track img { height: 48px; min-width: 104px; }
      .carousel-track { gap: 64px; }
    }
  </style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="page-wrap">
  <div class="page-content">
    <div class="brand-logo">
      <img src="/diageo-logo.png" alt="Diageo India" width="732" height="341" />
    </div>
    <div id="app">
      <div class="state-card" aria-live="polite">
        <div class="spinner"></div>
        <div class="state-title">Loading profile…</div>
      </div>
    </div>
  </div>

  <div class="brand-carousels" aria-hidden="true">
  <div class="carousel-track-wrap">
    <div class="carousel-track scroll-rtl">
      <img src="/brands/mcdowells.jpg" alt="McDowell's" />
      <img src="/brands/royalchallenge.jpg" alt="Royal Challenge" />
      <img src="/brands/smirnoff.svg" alt="Smirnoff" />
      <img src="/brands/godawan.jpg" alt="Godawan" />
      <img src="/brands/greaterthan.jpg" alt="Greater Than" />
      <img src="/brands/johnniewalker.jpg" alt="Johnnie Walker" />
      <img src="/brands/mcdowells.jpg" alt="McDowell's" />
      <img src="/brands/royalchallenge.jpg" alt="Royal Challenge" />
      <img src="/brands/smirnoff.svg" alt="Smirnoff" />
      <img src="/brands/godawan.jpg" alt="Godawan" />
      <img src="/brands/greaterthan.jpg" alt="Greater Than" />
      <img src="/brands/johnniewalker.jpg" alt="Johnnie Walker" />
    </div>
  </div>
  <div class="carousel-track-wrap">
    <div class="carousel-track scroll-ltr">
      <img src="/brands/donjulio.jpg" alt="Don Julio" />
      <img src="/brands/blackandwhite.jpg" alt="Black & White" />
      <img src="/brands/signature.jpg" alt="Signature" />
      <img src="/brands/hapusa.jpg" alt="Hapusa" />
      <img src="/brands/tanqueray.jpg" alt="Tanqueray" />
      <img src="/brands/baileys.svg" alt="Baileys" />
      <img src="/brands/donjulio.jpg" alt="Don Julio" />
      <img src="/brands/blackandwhite.jpg" alt="Black & White" />
      <img src="/brands/signature.jpg" alt="Signature" />
      <img src="/brands/hapusa.jpg" alt="Hapusa" />
      <img src="/brands/tanqueray.jpg" alt="Tanqueray" />
      <img src="/brands/baileys.svg" alt="Baileys" />
    </div>
  </div>
</div>
</div>

<script src="/profile.js"></script>
</body>
</html>
